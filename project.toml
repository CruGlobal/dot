# Buildpack build context (replaces .dockerignore): ship only the nine
# workloads' runtime source plus dot_shared/ (imported via PYTHONPATH=/app).
[build]
exclude = [
    ".git",
    ".github",
    ".idea",
    ".venv",
    "docs",
    "poc-terraform",
    "*.md",
    "**/*.md",
    "**/__pycache__",
    "**/.pytest_cache",
    "**/*.pyc",
    "**/*_test.py",
    "**/conftest.py",
    "**/requirements-test.txt",
    "**/.env",
    "**/.env.example",
    "**/poc_test.sh",
    "**/dockerfile",
    "**/job.yaml",
]
